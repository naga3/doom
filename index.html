<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOOM クローン — チェックボックスで描く 1bit の迷宮</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="controls">
  <label>表示方式
    <select id="backend">
      <option value="checkbox" selected>チェックボックス</option>
      <option value="table">table の td</option>
    </select>
  </label>
  <label>解像度
    <select id="size"></select>
  </label>
  <label>モード
    <select id="mode">
      <option value="A">A: checked のみ</option>
      <option value="B" selected>B: 輪郭だけ大きさで補間</option>
      <option value="C">C: 全セルの大きさで明暗（網点）</option>
    </select>
  </label>
  <label>敵の描き方
    <select id="sprite">
      <option value="emoji" selected>絵文字</option>
      <option value="dot">ドット</option>
    </select>
  </label>
  <label><input type="checkbox" id="sound" checked> 音</label>
  <label><input type="checkbox" id="auto"> 自動歩行</label>
</div>

<div id="stage">
  <div id="screen" class="screen" tabindex="0"></div>
  <div id="overlay" class="overlay" hidden>
    <p id="overlay-title"></p>
    <p id="overlay-body"></p>
    <p class="overlay-hint">R キーで最初からやり直す</p>
  </div>
</div>

<div id="status">
  <span id="face">😀</span>
  <span class="gauge">体力 <b id="hp">100</b></span>
  <span class="gauge">弾 <b id="ammo">30</b></span>
  <span class="gauge">残り <b id="left">0</b></span>
  <span class="gauge" id="level"></span>
</div>

<p id="hud"></p>
<p class="note" id="note">
  画面をクリックするとマウスで照準・旋回できます（Esc で解除）。WASD で移動、左右キーでも旋回。
  クリックかスペースで発砲。敵を全滅させると出口が開きます。
</p>

<script type="module" src="src/main.js"></script>
</body>
</html>
